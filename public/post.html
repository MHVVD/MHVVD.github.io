<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting — Mahmud Lawal</title>
  <meta name="robots" content="noindex">
  <!-- Legacy URL: post.html?slug=<slug>  ->  /blog/<slug>/ -->
  <script>
    (function () {
      var slug = new URLSearchParams(location.search).get('slug') || '';
      location.replace(/^[a-z0-9-]+$/i.test(slug) ? '/blog/' + slug.toLowerCase() + '/' : '/blog/');
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/blog/"></noscript>
</head>
<body>
  <p>Posts now live under <a href="/blog/">/blog/</a>.</p>
</body>
</html>
